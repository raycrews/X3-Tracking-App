[package]
name = "x3-workout-tracker"
version = "0.1.0"
description = "Offline-first X3 workout tracker"
authors = ["X3 Workout Tracker"]
edition = "2021"

[lib]
name = "x3_workout_tracker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
csv = "1"
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
