name: Build Packages

on:
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
            bundles: nsis
            artifact_name: x3-workout-tracker-windows
            artifact_path: |
              app/src-tauri/target/release/bundle/nsis/*.exe
              app/src-tauri/target/release/*.exe
          - platform: macos
            os: macos-latest
            bundles: app,dmg
            artifact_name: x3-workout-tracker-macos
            artifact_path: |
              app/src-tauri/target/release/bundle/dmg/*.dmg
              app/src-tauri/target/release/bundle/macos/*.app
          - platform: linux
            os: ubuntu-24.04
            bundles: deb
            artifact_name: x3-workout-tracker-linux-deb
            artifact_path: app/src-tauri/target/release/bundle/deb/*.deb

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install npm dependencies
        run: npm ci
        working-directory: app

      - name: Build package
        run: npm run tauri -- build --bundles ${{ matrix.bundles }}
        working-directory: app

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error
